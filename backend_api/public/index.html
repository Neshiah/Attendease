<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Attendance Rewards</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="app">
      <section class="auth-shell">
        <div class="brand">
          <div class="brand-mark">AR</div>
          <h1>Student Attendance Rewards</h1>
          <p>Attendance, feedback, points, and printing redemption in one web app.</p>
        </div>
        <form id="loginForm" class="panel">
          <h2>Login</h2>
          <label>
            Student ID or Email
            <input id="login" autocomplete="username" required />
          </label>
          <label>
            Password
            <input id="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit">Sign in</button>
          <p class="hint">Test admin: admin@test.com / password123</p>
        </form>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
